<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Noir Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Aged Parchment Evidence Card Gradient -->
    <linearGradient id="cardGrad" x1="12" y1="10" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf6e7" />
      <stop offset="100%" stop-color="#e7d6b5" />
    </linearGradient>

    <!-- Warm Brass / Amber Magnifier Rim Gradient -->
    <linearGradient id="brassGrad" x1="26" y1="22" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 3D Crimson Push-Pin Radial Gradient -->
    <radialGradient id="pinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Magnifier Lens Glass Tint -->
    <radialGradient id="lensGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#0c0a09" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.22" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. Rounded Crime-Board Base with Subtle Brass Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.65" />

  <!-- Subtle Forensic Grid Lines on Board -->
  <g stroke="#292524" stroke-width="1">
    <line x1="16" y1="4" x2="16" y2="60" />
    <line x1="32" y1="4" x2="32" y2="60" />
    <line x1="48" y1="4" x2="48" y2="60" />
    <line x1="4" y1="16" x2="60" y2="16" />
    <line x1="4" y1="32" x2="60" y2="32" />
    <line x1="4" y1="48" x2="60" y2="48" />
  </g>

  <!-- 2. Tilted Parchment Evidence Card (#01) -->
  <g transform="rotate(-8 25 29)" filter="url(#dropShadow)">
    <rect x="10" y="11" width="29" height="36" rx="3" fill="url(#cardGrad)" stroke="#78350f" stroke-width="1.2" />
    <!-- Dark Card Header Strip -->
    <rect x="12.5" y="14" width="11" height="4.5" rx="1" fill="#1c1917" />
    <rect x="25.5" y="14" width="11" height="4.5" rx="1" fill="#991b1b" />
    <!-- Sketch / Evidence Lines -->
    <rect x="12.5" y="21" width="24" height="9" rx="1.2" fill="#d6c29f" stroke="#78350f" stroke-width="0.8" />
    <path d="M14.5 28 L19 23.5 L23 26.5 L28 22.5 L34.5 28" stroke="#451a03" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Typewriter Clue Lines + Yellow Highlight -->
    <rect x="12.5" y="32.5" width="19" height="3" rx="1" fill="#facc15" opacity="0.85" />
    <line x1="13" y1="34" x2="34" y2="34" stroke="#292524" stroke-width="1.6" stroke-linecap="round" />
    <line x1="13" y1="38.5" x2="31" y2="38.5" stroke="#44403c" stroke-width="1.5" stroke-linecap="round" />
    <line x1="13" y1="42.5" x2="25" y2="42.5" stroke="#57534e" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 3. Red Investigative String Connecting two Push-Pins -->
  <path d="M23 11.5 Q 38 14, 51 14.5" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" filter="url(#dropShadow)" />
  <path d="M23 11.5 Q 38 14, 51 14.5" stroke="#fca5a5" stroke-width="0.8" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.75" />

  <!-- Secondary Pin (Top Right Anchor) -->
  <circle cx="51" cy="14.5" r="4" fill="url(#pinGrad)" stroke="#450a0a" stroke-width="1" filter="url(#dropShadow)" />
  <circle cx="49.8" cy="13.3" r="1.1" fill="#ffffff" opacity="0.75" />

  <!-- Main Card Push-Pin (Top Left on Card) -->
  <circle cx="23" cy="11.5" r="4.8" fill="url(#pinGrad)" stroke="#450a0a" stroke-width="1.1" filter="url(#dropShadow)" />
  <circle cx="21.5" cy="10" r="1.4" fill="#ffffff" opacity="0.85" />

  <!-- 4. Forensic Magnifying Glass (Bottom-Right Focus) -->
  <g filter="url(#dropShadow)">
    <!-- Magnifier Handle -->
    <path d="M47.5 47.5 L57 57" stroke="#78350f" stroke-width="6.5" stroke-linecap="round" />
    <path d="M47.5 47.5 L57 57" stroke="url(#brassGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M46.2 46.2 L49.5 49.5" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round" />

    <!-- Lens Glass -->
    <circle cx="38" cy="38" r="13.5" fill="url(#lensGrad)" />

    <!-- Magnified Red String & Crimson Fingerprint / Crosshair Clue inside Lens -->
    <path d="M27 35 Q 38 39, 49 34" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <path d="M33 38 C33 34.5, 43 34.5, 43 38 C43 41.5, 39 44, 35 43" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.95" />
    <path d="M35.5 38 C35.5 36.2, 40.5 36.2, 40.5 38 C40.5 39.8, 38.5 41, 36.5 40.5" stroke="#fde68a" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <circle cx="38" cy="38" r="1.5" fill="#ef4444" />

    <!-- Specular Glass Glint Arc -->
    <path d="M29.5 32.5 A 10 10 0 0 1 41.5 28.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.7" />

    <!-- Outer Brass Rim of Magnifying Glass -->
    <circle cx="38" cy="38" r="13.5" stroke="url(#brassGrad)" stroke-width="3.4" />
    <circle cx="38" cy="38" r="11.5" stroke="#451a03" stroke-width="0.8" opacity="0.6" />
  </g>
</svg>
